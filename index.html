<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@DungThichVAR - VR/AR Nova Hub</title>
    <meta name="description" content="Review kính VR/AR mới nhất - @DungThichVAR trên YouTube, TikTok, Facebook, Instagram">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            height: 100%; 
            overflow: hidden; 
            background: transparent;
        }
        body {
            font-family: 'Orbitron', sans-serif;
            color: #e0f7ff;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            position: relative;
        }

        /* === CANH GIỮA + LƠ LỬNG TRÊN GALAXY === */
        .container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            width: 100%;
            max-width: 460px;
            padding: 20px;
        }

        /* === @DUNGTHICHVAR - GIỮ NGUYÊN ĐỊNH DẠNG, KHÔNG UPPERCASE === */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: #00ffff;
            text-shadow: 
                0 0 10px #00ffff,
                0 0 20px #00bfff;
            margin-bottom: 30px;
            letter-spacing: 3px;
            pointer-events: none;
            /* Không uppercase */
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 18px;
            pointer-events: auto;
        }

        /* === BUTTON GIỐNG HÌNH: KÍNH MỜ + VIỀN NEON + GÓC CẮT === */
        .space-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 16px 40px;
            height: 62px;
            background: rgba(10, 40, 70, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 8px;
            color: #a0f7ff;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.4rem;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 
                0 8px 32px rgba(0, 255, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2);
            clip-path: polygon(
                12px 0%, 
                calc(100% - 12px) 0%, 
                100% 50%, 
                calc(100% - 12px) 100%, 
                12px 100%, 
                0% 50%
            );
            /* Góc cắt giống hình */
        }

        /* === VIỀN NEON GÓC TRÊN + DƯỚI === */
        .space-button::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            background: 
                linear-gradient(135deg, transparent 8px, #00ffff 8px, #00ffff 10px, transparent 10px),
                linear-gradient(225deg, transparent 8px, #00ffff 8px, #00ffff 10px, transparent 10px),
                linear-gradient(45deg, transparent 8px, #00bfff 8px, #00bfff 10px, transparent 10px),
                linear-gradient(315deg, transparent 8px, #00bfff 8px, #00bfff 10px, transparent 10px);
            background-size: 100% 50%, 100% 50%, 100% 50%, 100% 50%;
            background-position: top left, top right, bottom right, bottom left;
            background-repeat: no-repeat;
            opacity: 0.8;
        }

        /* === GLOW KHI HOVER === */
        .space-button::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.8s ease;
            pointer-events: none;
            z-index: 1;
        }
        .space-button:hover::after {
            transform: translateX(100%);
        }

        /* === HOVER: NÂNG + GLOW MẠNH === */
        .space-button:hover {
            transform: translateY(-10px) translateZ(30px) scale(1.04);
            background: rgba(15, 55, 90, 0.75);
            border-color: #00ffff;
            box-shadow: 
                0 20px 50px rgba(0, 255, 255, 0.45),
                0 0 40px rgba(0, 255, 255, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .space-button i {
            font-size: 1.7em;
            filter: drop-shadow(0 0 8px #00ffff);
            transition: transform 0.3s;
            z-index: 2;
            position: relative;
        }
        .space-button:hover i {
            transform: scale(1.15);
        }
        .space-button span {
            position: relative;
            z-index: 2;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
        }

        /* ẨN TEXT NOVA */
        #word { display: none; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- GALAXY NOVA BACKGROUND -->
    <div id="word">@DungThichVAR</div>

    <!-- BUTTONS LƠ LỬNG GIỮA MÀN HÌNH -->
    <div class="container">
        <h1>@DungThichVAR</h1>
        <div class="social-links">
            <a href="https://youtube.com/@DungThichVAR" target="_blank" class="space-button">
                <i class="fab fa-youtube"></i>
                <span>YouTube</span>
            </a>
            <a href="https://facebook.com/hoangdungnguyenksp" target="_blank" class="space-button">
                <i class="fab fa-facebook-f"></i>
                <span>Facebook</span>
            </a>
            <a href="https://tiktok.com/@DungThichVAR" target="_blank" class="space-button">
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
            </a>
            <a href="https://instagram.com/DungThichVAR" target="_blank" class="space-button">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>
            <a href="https://facebook.com/groups/DungThichVAR" target="_blank" class="space-button">
                <i class="fab fa-facebook"></i>
                <span>Group VR/AR</span>
            </a>
        </div>
    </div>

    <!-- THREE.JS GALAXY NOVA (GIỮ NGUYÊN) -->
    <script type="module">
        import * as THREE from "https://cdn.skypack.dev/three@0.136.0";
        import {OrbitControls} from "https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls";

        let scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000814);
        let camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 1, 1000);
        camera.position.set(0, 4, 21);
        let renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        window.addEventListener("resize", () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
        });

        let controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enablePan = false;

        let gu = { time: { value: 0 } };

        let sizes = [];
        let shift = [];
        let pushShift = () => {
          shift.push(
            Math.random() * Math.PI, 
            Math.random() * Math.PI * 2, 
            (Math.random() * 0.9 + 0.1) * Math.PI * 0.1,
            Math.random() * 0.9 + 0.1
          );
        };

        let pts = new Array(50000).fill().map(p => {
          sizes.push(Math.random() * 1.5 + 0.5);
          pushShift();
          return new THREE.Vector3().randomDirection().multiplyScalar(Math.random() * 0.5 + 9.5);
        });

        for(let i = 0; i < 100000; i++){
          let r = 10, R = 40;
          let rand = Math.pow(Math.random(), 1.5);
          let radius = Math.sqrt(R * R * rand + (1 - rand) * r * r);
          pts.push(new THREE.Vector3().setFromCylindricalCoords(radius, Math.random() * 2 * Math.PI, (Math.random() - 0.5) * 2 ));
          sizes.push(Math.random() * 1.5 + 0.5);
          pushShift();
        }

        let g = new THREE.BufferGeometry().setFromPoints(pts);
        g.setAttribute("sizes", new THREE.Float32BufferAttribute(sizes, 1));
        g.setAttribute("shift", new THREE.Float32BufferAttribute(shift, 4));
        let m = new THREE.PointsMaterial({
          size: 0.125,
          transparent: true,
          depthTest: false,
          blending: THREE.AdditiveBlending,
          onBeforeCompile: shader => {
            shader.uniforms.time = gu.time;
            shader.vertexShader = `
              uniform float time;
              attribute float sizes;
              attribute vec4 shift;
              varying vec3 vColor;
              ${shader.vertexShader}
            `.replace(`gl_PointSize = size;`, `gl_PointSize = size * sizes;`)
            .replace(`#include <color_vertex>`, `#include <color_vertex>
              float d = length(abs(position) / vec3(40., 10., 40));
              d = clamp(d, 0., 1.);
              vColor = mix(vec3(227., 155., 0.), vec3(100., 50., 255.), d) / 255.;
            `)
            .replace(`#include <begin_vertex>`, `#include <begin_vertex>
              float t = time;
              float moveT = mod(shift.x + shift.z * t, PI2);
              float moveS = mod(shift.y + shift.z * t, PI2);
              transformed += vec3(cos(moveS) * sin(moveT), cos(moveT), sin(moveS) * sin(moveT)) * shift.w;
            `);
            shader.fragmentShader = `
              varying vec3 vColor;
              ${shader.fragmentShader}
            `.replace(`#include <clipping_planes_fragment>`, `#include <clipping_planes_fragment>
              float d = length(gl_PointCoord.xy - 0.5);
            `).replace(`vec4 diffuseColor = vec4( diffuse, opacity );`, `vec4 diffuseColor = vec4( vColor, smoothstep(0.5, 0.1, d) );`);
          }
        });
        let p = new THREE.Points(g, m);
        p.rotation.order = "ZYX";
        p.rotation.z = 0.2;
        scene.add(p);

        let clock = new THREE.Clock();
        renderer.setAnimationLoop(() => {
          controls.update();
          let t = clock.getElapsedTime() * 0.5;
          gu.time.value = t * Math.PI;
          p.rotation.y = t * 0.05;
          renderer.render(scene, camera);
        });
    </script>
</body>
</html>
