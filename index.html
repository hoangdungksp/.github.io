<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@DungThichVAR - VR/AR Galaxy Hub</title>
    <meta name="description" content="Review kính VR/AR mới nhất - @DungThichVAR trên YouTube, TikTok, Facebook, Instagram">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: #000; }
        body {
            font-family: 'Rajdhani', 'Arial', sans-serif;
            color: #e0f7ff;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* === BACKGROUND DÃI NGÂN HÀ NHẸ === */
        #galaxy-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, #001122 0%, #000 70%);
            z-index: 1;
        }
        .stars { 
            position: absolute; 
            background: white; 
            border-radius: 50%; 
            box-shadow: 0 0 4px #fff;
            animation: twinkle 3s infinite alternate;
        }
        @keyframes twinkle { to { opacity: 0.5; } }

        /* === NÚT TÀU KHÔNG GIAN - ĐÃ SỬA LỖI HOVER === */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }
        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 40px;
            background: linear-gradient(90deg, #00d4ff, #0077b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
            letter-spacing: 3px;
        }
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-width: 380px;
            margin: 0 auto;
        }
        .space-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 16px 32px;
            background: linear-gradient(145deg, #0a1a2f, #0f2d52);
            border: 2px solid transparent;
            border-image: linear-gradient(45deg, #00bfff, #48cae4) 1;
            border-radius: 50px;
            color: #e0f7ff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 25px rgba(0, 191, 255, 0.2), inset 0 1px 0 rgba(255,255,255,0.1);
            transform: translateZ(0);
            /* QUAN TRỌNG: pointer-events chỉ cho nội dung */
            pointer-events: auto;
        }

        /* === HIỆU ỨNG QUÉT SÁNG KHÔNG CHẶN HOVER === */
        .space-button::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 191, 255, 0.4), transparent);
            transform: skewX(-20deg);
            transition: left 0.7s ease;
            pointer-events: none; /* Không chặn hover */
            z-index: 1;
        }
        .space-button:hover::after {
            left: 100%;
        }

        .space-button:hover {
            transform: translateY(-8px) translateZ(20px) scale(1.03);
            background: linear-gradient(145deg, #0f2d52, #1e4d7a);
            border-image: linear-gradient(45deg, #48cae4, #00d4ff) 1;
            box-shadow: 0 20px 50px rgba(0, 191, 255, 0.4), 0 0 40px rgba(0, 212, 255, 0.3);
        }
        .space-button i {
            font-size: 1.6em;
            filter: drop-shadow(0 0 8px #00bfff);
            transition: transform 0.3s;
            z-index: 2;
            position: relative;
        }
        .space-button:hover i {
            transform: scale(1.2) rotate(5deg);
        }
        .space-button span {
            position: relative;
            z-index: 2;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="galaxy-bg"></div>

    <div class="container">
        <h1>@DungThichVAR</h1>
        <div class="social-links">
            <a href="https://youtube.com/@DungThichVAR" target="_blank" class="space-button">
                <i class="fab fa-youtube"></i>
                <span>YouTube</span>
            </a>
            <a href="https://facebook.com/hoangdungnguyenksp" target="_blank" class="space-button">
                <i class="fab fa-facebook-f"></i>
                <span>Facebook</span>
            </a>
            <a href="https://tiktok.com/@DungThichVAR" target="_blank" class="space-button">
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
            </a>
            <a href="https://instagram.com/DungThichVAR" target="_blank" class="space-button">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>
            <a href="https://www.facebook.com/groups/818997420163696" target="_blank" class="space-button">
                <i class="fab fa-facebook"></i>
                <span>Group VR/AR</span>
            </a>
        </div>
    </div>

    <script>
        // === Tạo sao + tinh vân (giữ nguyên, nhẹ) ===
        const bg = document.getElementById('galaxy-bg');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'stars';
            const size = Math.random() * 2 + 0.5;
            star.style.width = star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.animationDuration = (Math.random() * 2 + 2) + 's';
            bg.appendChild(star);
        }

        for (let i = 0; i < 3; i++) {
            const nebula = document.createElement('div');
            nebula.style.position = 'absolute';
            nebula.style.borderRadius = '50%';
            nebula.style.filter = 'blur(80px)';
            nebula.style.mixBlendMode = 'screen';
            nebula.style.opacity = '0.15';
            nebula.style.pointerEvents = 'none';
            const size = Math.random() * 600 + 400;
            nebula.style.width = nebula.style.height = size + 'px';
            nebula.style.left = Math.random() * 100 + '%';
            nebula.style.top = Math.random() * 100 + '%';
            nebula.style.background = `radial-gradient(circle, rgba(0,180,255,0.3) 0%, rgba(0,119,182,0.2) 40%, transparent 70%)`;
            nebula.style.animation = `nebula-float ${15 + i*5}s infinite linear`;
            bg.appendChild(nebula);
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes nebula-float {
                from { transform: translate(0, 0) rotate(0deg); }
                to { transform: translate(5%, 5%) rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
